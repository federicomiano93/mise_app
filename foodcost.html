<!--
  THE ITALIAN CLUB PWA — Food cost
  Finished products: what each one costs to make, what share of its price that
  is, and whether it is inside its target. Costs come from the recipes in the
  catalogue, which in turn come from the prices entered in Orders.
  All logic lives in js/foodcost/* (loaded via foodcost-main.js).
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  CSP bootstrap. A <meta> Content-Security-Policy cannot be loosened at runtime
  (multiple policies combine by intersection), so to allow the LOCAL Firebase
  emulator on localhost WITHOUT touching the live site's policy, the meta is
  emitted here. On the live domain the string is byte-identical to the production
  policy; on localhost only, connect-src additionally allows the Auth (9099) and
  Firestore (8080) and Functions (5001) emulators.
  ⚠️ THE FUNCTIONS ORIGIN HAD TO BE ADDED TO THE LIVE POLICY TOO. Until the
  onboarding calls, nothing in this app ever called a Cloud Function from a
  browser — the existing ones are triggered by Firestore, server to server — so
  connect-src had never needed it. Without it every callable fails with the
  client's generic 'internal', which says nothing about a blocked request. This inline script runs before any CSP is in effect
  (only <meta charset> precedes it) and before any network request.
-->
<script>
(function () {
  var local = ['localhost', '127.0.0.1', '::1', '[::1]'].indexOf(location.hostname) !== -1;
  var emu = local
    ? ' http://localhost:8080 http://localhost:9099 http://localhost:5001 http://127.0.0.1:8080 http://127.0.0.1:9099 http://127.0.0.1:5001'
    : '';
  document.write(
    '<meta http-equiv="Content-Security-Policy" content="' +
    "default-src 'self'; " +
    "script-src 'self' https://www.gstatic.com; " +
    "connect-src 'self' https://www.gstatic.com https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://us-central1-bakery-app-ebf90.cloudfunctions.net" + emu + "; " +
    "frame-src 'self'; " +
    "img-src 'self' data:; " +
    "style-src 'self'; " +
    "font-src 'self'; " +
    "base-uri 'self'; " +
    "form-action 'self'" +
    '">'
  );
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Open the connections to Google now, while the page is still loading its own
     files: otherwise each one starts only when Firebase first needs it, and on a
     phone opening the app after a pause that is a fresh handshake per server, one
     after the other (sign-in token, account check, database). ⚠️ crossorigin on the
     two Auth hosts and NOT on the database, and it is measured, not a slip: Auth calls
     without cookies and Firestore with them, and a browser keeps the two kinds of
     connection apart — a hint of the wrong kind warms a connection nothing uses.
     tests/preconnect.test.mjs keeps every Firebase page carrying all three, each its kind. -->
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<meta name="description" content="Food cost — what each product costs to make and what it earns.">
<meta name="theme-color" content="#2D5016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mise">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="foodcost.css">
<title data-i18n="title.foodcost">Food cost — Mise</title>
</head>
<body data-section="foodcost" data-card="foodcost">
<!-- Sign-in cover. It is HERE, in the markup, so it is opaque from the first
     paint: the app must never flash a location's data at whoever is holding
     the phone. js/auth-gate.js fills it in and removes it once a location is
     open.

     ⚠️ NOTHING BETWEEN THE TAGS. tokens.css styles `.auth-gate:empty` as the
     page background and the non-empty one as the green sign-in screen, so a
     newline or a comment in here brings back the full-green flash on every
     navigation that v1.21.1 fixed. -->
<div id="auth-gate" class="auth-gate"></div>

<!-- Three fixed tracks (left slot · title · right slot) so the title is TRULY
     centred: only one button of the left slot is ever visible, and an empty slot must
     still hold its column or the title drifts off-centre. The right slot holds the
     round «+» (shown on the list only, like the Catalogue's) beside the help button. -->
<header class="app-header">
  <span class="app-header-slot">
    <a class="app-icon-btn" id="fcHome" href="index.html" data-i18n="ui.back" data-i18n-attr="aria-label" aria-label="Back">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <button class="app-icon-btn" id="fcBack" data-i18n="ui.back" data-i18n-attr="aria-label" aria-label="Back" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </span>
  <div class="app-header-title">
    <h1 id="fcTitle" data-i18n="section.foodcost">Food cost</h1>
    <p id="fcSub" data-i18n="fc.productsAndMargins">Products and margins</p>
  </div>
  <span class="app-header-slot" data-help="foodcost">
    <button class="app-icon-btn" id="fcAdd" data-i18n="fc.newProduct" data-i18n-attr="aria-label" aria-label="New product" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </span>
</header>

<!-- ⚠️ TWO COLUMNS ON A TABLET ONLY, and only for the list, a product and its history: the
     list on the left (#fcListCol), the product on the right (#fcScreen, which takes
     `app-split-pane` from foodcost-main.js while the split is on). On a phone #fcListCol
     stays hidden and #fcScreen is the whole screen, exactly as before. -->
<div class="app-split fc-split" id="fcSplit" data-split="off">
  <div class="app-split-list" id="fcListCol" hidden></div>
  <main class="fc-screen" id="fcScreen"></main>
</div>

<!-- The bottom bar (13 Sep 2026): Settings, where the hourly labour cost is set.
     ⚠️ EACH BUTTON CARRIES ITS OWN PERMISSION AND THE BAR CARRIES NONE — the bar is hidden
     while none of its buttons is (js/foodcost/foodcost-main.js). Settings is for whoever
     runs the place: the rate is a wage figure. -->
<div class="fc-footer" id="fcFooter" hidden>
  <button class="fc-footer-btn" id="fcSettings" type="button" hidden>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span data-i18n="ui.settings">Settings</span>
  </button>
</div>

<!-- The confirm dialog is built on demand by js/foodcost/confirm-dialog.js
     (the shared .app-dialog-* component), so no static markup is needed. -->

<div class="fc-toast" id="fcToast"></div>

<script type="module" src="js/i18n-dom.js"></script>
<script type="module" src="js/auth-gate.js"></script>
<script type="module" src="js/sw-update.js"></script>
<script type="module" src="js/idle-reset.js"></script>
<script type="module" src="js/foodcost/foodcost-main.js"></script>
<script type="module" src="js/help-button.js"></script>
</body>
</html>
