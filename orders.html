<!--
  MISE — Orders
  Supplier-order workflow. Header + navigation + scroll area.
  All logic lives in js/orders/* (loaded via orders-main.js).
  Reuses style.css; new styles in orders.css.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  CSP bootstrap. A <meta> Content-Security-Policy cannot be loosened at runtime
  (multiple policies combine by intersection), so to allow the LOCAL Firebase
  emulator on localhost WITHOUT touching the live site's policy, the meta is
  emitted here. On the live domain the string is byte-identical to the production
  policy (gov.uk kept for the bank-holiday calendar); on localhost only, connect-src
  additionally allows the Auth (9099) and Firestore (8080) and Functions (5001) emulators.
  ⚠️ THE FUNCTIONS ORIGIN HAD TO BE ADDED TO THE LIVE POLICY TOO. Until the
  onboarding calls, nothing in this app ever called a Cloud Function from a
  browser — the existing ones are triggered by Firestore, server to server — so
  connect-src had never needed it. Without it every callable fails with the
  client's generic 'internal', which says nothing about a blocked request. This inline
  script runs before any CSP is in effect (only <meta charset> precedes it) and
  before any network request.
-->
<script>
(function () {
  var local = ['localhost', '127.0.0.1', '::1', '[::1]'].indexOf(location.hostname) !== -1;
  var emu = local
    ? ' http://localhost:8080 http://localhost:9099 http://localhost:5001 http://127.0.0.1:8080 http://127.0.0.1:9099 http://127.0.0.1:5001'
    : '';
  document.write(
    '<meta http-equiv="Content-Security-Policy" content="' +
    "default-src 'self'; " +
    "script-src 'self' https://www.gstatic.com; " +
    "connect-src 'self' https://www.gstatic.com https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://www.gov.uk https://us-central1-bakery-app-ebf90.cloudfunctions.net" + emu + "; " +
    "frame-src 'self'; " +
    "img-src 'self' data:; " +
    "style-src 'self'; " +
    "font-src 'self'; " +
    // Neither is covered by default-src, so both have to be stated. base-uri stops
    // an injected <base> from re-pointing every relative URL on the page; the app
    // has no <form> at all, so form-action 'self' can only ever refuse something
    // that should not be there.
    "base-uri 'self'; " +
    "form-action 'self'" +
    '">'
  );
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Open the connections to Google now, while the page is still loading its own
     files: otherwise each one starts only when Firebase first needs it, and on a
     phone opening the app after a pause that is a fresh handshake per server, one
     after the other (sign-in token, account check, database). ⚠️ crossorigin on the
     two Auth hosts and NOT on the database, and it is measured, not a slip: Auth calls
     without cookies and Firestore with them, and a browser keeps the two kinds of
     connection apart — a hint of the wrong kind warms a connection nothing uses.
     tests/preconnect.test.mjs keeps every Firebase page carrying all three, each its kind. -->
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<meta name="description" content="Supplier orders — plan and send ingredient orders.">
<meta name="theme-color" content="#2D5016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mise">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="orders.css">
<title data-i18n="title.orders">Orders — Mise</title>
</head>
<body data-section="orders" data-card="orders">
<!-- Sign-in cover. It is HERE, in the markup, so it is opaque from the first
     paint: the app must never flash a location's data at whoever is holding
     the phone. js/auth-gate.js fills it in and removes it once a location is
     open. -->
<div id="auth-gate" class="auth-gate"></div>


<header class="app-header orders-header">
  <span class="app-header-slot">
    <a class="app-icon-btn orders-icon-btn" href="index.html" data-i18n="ui.back" data-i18n-attr="aria-label" aria-label="Back">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
  </span>
  <div class="app-header-title orders-header-title">
    <h1 data-i18n="section.orders">Orders</h1>
    <p data-i18n="ui.supplierOrders">Supplier orders</p>
  </div>
  <!-- ⚠️⚠️ THE RIGHT-HAND GROUP, ON PHONE AND TABLET ALIKE (Federico, 28 Sep 2026:
       «le liste d'ordine mettile nella barra in alto verde, anche gli avvisi degli
       ordini»). Bell, order lists, send — one flex group pushed right, so the title
       keeps the space that is left and nothing ever wraps. The «?» that used to sit
       here is now the «Help» row inside Settings: five round buttons do not fit a
       296px phone. «To re-order» (2 Oct 2026) is the fourth button, and the bell, the
       order lists and the send arrow are the other three: four is the most that fit. -->
  <div class="app-header-slot orders-header-actions">
    <!-- ⚠️ «DA RIORDINARE»: what never arrived and nobody has dealt with yet. Its own button,
         LEFT of the bell, and NOT a notice inside it. Shown by JS
         (js/orders/deliveries-view.js renderReorderButton) only while something is to be
         re-ordered; the number is the count of those lines. Opens the list screen. -->
    <button class="app-icon-btn orders-icon-btn" id="orders-reorder-btn" type="button" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      <span class="orders-head-dot" id="orders-reorder-count" aria-hidden="true" hidden></span>
    </button>
    <!-- The bell: js/orders/tablet-layout.js moves the banners that ask for
         something (not placed, changed since sent, the calendar)
         into #orders-alerts-panel below, at EVERY size, and this opens it. Shown by
         JS only when there is something inside; the number is DERIVED from the
         panel's own children (initAlertsPanel), never written by hand. -->
    <button class="app-icon-btn orders-icon-btn orders-alerts-btn" id="orders-alerts-btn" type="button" aria-expanded="false" aria-controls="orders-alerts-panel" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="orders-head-dot" id="orders-alerts-count" aria-hidden="true" hidden></span>
    </button>
    <!-- Order lists (js/orders/orders-main.js renderListsButton): opens the list
         screen that already existed. Crust-coloured while a list is waiting — the
         colour is the signal, as the card at the foot of the page used to be. Hidden
         when the venue has turned order lists off (config/orders.orderLists). -->
    <button class="app-icon-btn orders-icon-btn orders-lists-btn" id="orders-lists-btn" type="button" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10l1.5 1.5L13 9"/><path d="M9 15h6"/></svg>
      <span class="orders-head-dot" id="orders-lists-count" aria-hidden="true" hidden></span>
    </button>
    <!-- ⚠️ A SEND ARROW, NOT THE WHATSAPP MARK — it offers four roads, and a WhatsApp
         glyph would name only one. 📌 Chosen by Federico on 14 Aug from three mounted
         side by side. -->
    <button class="app-icon-btn orders-icon-btn" id="orders-wa-btn" type="button" data-i18n="ui.send" data-i18n-attr="aria-label" aria-label="Send"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M4 15v4a2 2 0 002 2h12a2 2 0 002-2v-4"/></svg></button>
  </div>
  <!-- ⚠️⚠️ A CHILD OF THE HEADER ON PURPOSE (phone and tablet since 28 Sep 2026) —
       see the note on #orders-alerts-btn above. Absolutely positioned, so it sits under the
       header without disturbing the header's own flex row, and is anchored to
       .orders-header (position: relative) rather than to the
       page, which is what lets it hang under the button that opens it however
       far down the page has scrolled. js/orders/tablet-layout.js relocates the
       banner HOSTS in here; the renderers that fill them (notifications.js,
       deliveries-view.js, reminder-view.js, untold-view.js) are unchanged and
       keep finding them by id. Order inside: pending, untold, alerts
       (js/orders/tablet-layout.js TABLET_HOSTS). Not a modal, and deliberately
       NOT .preview-overlay — a compulsory update must never be held back by
       this. -->
  <div id="orders-alerts-panel" hidden role="region" data-i18n="orders.alerts.panelRegion" data-i18n-attr="aria-label" aria-label="Notices"></div>
</header>

<div class="scroll-area scroll-with-bar">

  <!-- ⚠️⚠️ THE COLUMN THAT KEEPS EVERYTHING OFF THE SCREEN EDGE. On a phone
       .scroll-area has NO horizontal padding of its own (--app-gutter is 0 there, so
       that no phone lost a pixel when tablets got their column in v1.56.0) — every
       block inside has always brought its own. These three do not: the status line
       and the notices are bare containers, and the box needs a MARGIN rather than
       padding so its border sits inside the screen.
       ⚠️ tests/screen-gutter.test.mjs is what caught this, on the first run after the
       restructure. It is the guard written for the v1.70.0 defect — rows flush against
       both edges of the phone — and it works. -->
  <div class="orders-column">

  <!-- Action feedback only (e.g. "Order saved ✓"): starts empty/hidden. The
       connection state is NOT shown here — see #orders-offline below. -->
  <p class="orders-status" id="orders-status" hidden></p>

  <!-- ⚠️⚠️ THE CALENDAR NOTICES, AT THE TOP AND CLOSEABLE (Federico, 24 Aug 2026).
       A coming holiday is something to READ ONCE, so it can be put away — and it
       comes back on its own when the holiday is a DIFFERENT one, because every alert
       carries a stable key.
       ⚠️ NOTHING ELSE ON THIS SCREEN CAN BE CLOSED. Everything below is WORK, and a
       closeable piece of work is one somebody can close by mistake and never see
       again. -->
  <div id="orders-alerts" hidden></div>

  <!-- ⚠️⚠️ PHONE AND TABLET (since 28 Sep 2026). Today's orders and the debt banner
       move here, in that order (today first) — js/orders/tablet-layout.js. Which of
       the two shows is decided by the tab (orders.css, body[data-orders-tab]): today's
       chips on Order, the debt on Incoming. -->
  <div id="orders-tablet-strip"></div>

  <!-- ⚠️⚠️ ONE BOX, SO IT READS AS ONE JOB (Federico, 24 Aug 2026). The two tabs,
       the two views and the suppliers under them are all the same piece of work, and
       until now nothing on the screen said so — ten blocks in a column, all looking
       alike.
       ⚠️⚠️ THE HEAD IS STICKY, AND IT HAS TO BE MADE SO. The tab bar used to sit
       OUTSIDE .scroll-area, which is the only reason it stayed put; inside the box
       it would scroll away, and changing view half way down a long list would mean
       scrolling back to the top to do it. -->
  <div class="order-box">
    <div class="order-box-head">
      <!-- ⚠️ TWO TABS, AND HISTORY IS STILL NOT ONE OF THEM. It is a reference,
           consulted rarely, and it was taking half this bar every day for it; what
           belongs in that half is the thing you are waiting for. -->
      <nav class="tab-bar" data-i18n="aria.ordersSections" data-i18n-attr="aria-label" aria-label="Orders sections">
        <button class="tab active" id="tab-order-btn" data-i18n="ui.order">Order</button>
        <!-- ⚠️ TEXT AND BADGE ARE SEPARATE NODES. i18n-dom.js overwrites the
             whole textContent of anything carrying data-i18n on every
             language switch, so a badge span living directly under the same
             data-i18n element would be wiped the first time the language
             changed. The badge (every size since 28 Sep 2026) shows the debt
             owed count from renderOwedBanner; js/orders/orders-main.js keeps
             it in step. -->
        <button class="tab" id="tab-deliveries-btn">
          <span data-i18n="orders.deliveries.tab">Incoming</span>
          <span class="tab-badge" id="tab-deliveries-badge" hidden aria-hidden="true"></span>
        </button>
      </nav>
      <!-- Two windows onto the SAME order. Quantities are stored per ingredient, so
           typing 4 on Bacon in the flat list is typing 4 in Cielo's order — there is
           no second list to keep in step. "By supplier" is the default and the choice
           is remembered in localStorage.
           ⚠️⚠️ IT LIVES IN THE HEAD NOW, SO IT NO LONGER HIDES ITSELF BY BEING
           INSIDE THE ORDER PANEL. One function decides whether it is shown — see
           refreshViewSwitch() — and it has to answer for BOTH conditions: the
           Incoming tab, and a venue with no suppliers yet. -->
        <div class="view-switch" id="order-view-switch" role="tablist" data-i18n="aria.orderView" data-i18n-attr="aria-label" aria-label="Order view" hidden>
        <button class="view-switch-btn active" id="view-by-supplier" type="button" role="tab" aria-selected="true" data-i18n="orders.bySupplier">By supplier</button>
        <button class="view-switch-btn" id="view-all-ingredients" type="button" role="tab" aria-selected="false" data-i18n="ui.ingredients">Ingredients</button>
      </div>
    </div>

    <!-- ORDER -->
    <section class="content active" id="tab-order">
    <!-- Each reminder owns its own container: they are painted by different
         functions on different snapshots, and one shared container would mean every
         paint wiped the others. #orders-pending comes first — it is the only one
         asking for an action. -->
    <!-- ⚠️ WHAT NEVER ARRIVED, AT THE TOP OF THE SCREEN WHERE THE ORDER IS TYPED.
         The answer to "so I do not forget to order them" is not a list on a screen
         nobody opens; it is a line where the work already happens. It goes quiet by
         itself, because it is DERIVED — nothing to mark as done, so nothing that can
         be left switched on by a failed write. -->
    <!-- ⚠️ IL DEBITO VIENE PRIMA DI TUTTO. What left the week without an answer, and
         this banner NEVER goes quiet by itself — the one below switches off because the
         work got done, this one only because somebody ANSWERED. It is what makes a
         strict week window safe: without it an order that never arrived would vanish,
         unanswered, on the day the week turned. -->
    <div id="orders-owed" hidden></div>
    <!-- ⚠️⚠️ WHAT NOBODY HAS BEEN TOLD ABOUT. The shared order is live on every
         phone here, and both the sent list and the recorded order are only
         photographs of it — so somebody can add to it after the person who buys
         has already read it, or already telephoned. Derived, so it goes quiet by
         itself the moment the list is sent again or the order is recorded, and
         there is deliberately nothing to dismiss. -->
    <div id="orders-untold" hidden></div>
    <div id="orders-pending"></div>
    <div id="orders-today"></div>
    <!-- The per-supplier "Order placed" lives on each supplier card, so recording
         a supplier's Monday order cannot wipe the quantities already typed for the
         supplier you order on Thursday. The button below does NOT bring back the
         old global one that archived everything into a single record: it opens a
         tick-list, and each supplier still gets its own {day}_{supplier} record.
         In the by-supplier view it stays hidden until TWO suppliers have quantities
         — with one, the button on its own card is right there. In the flat list
         there are no cards, so ONE is enough. -->
    <!-- Two windows onto the SAME order. Quantities are stored per ingredient, so
         typing 4 on Bacon in the flat list is typing 4 in Cielo's order — there is
         no second list to keep in step. "By supplier" is the default and the choice
         is remembered in localStorage. -->
    <!-- #suppliers-list is the ONE container both list views mount into (by supplier,
         and the flat list of every ingredient). A supplier's own order opens full screen
         over the page, appended to document.body, on a phone and on a tablet alike. -->
    <div id="suppliers-list"></div>
    <button class="btn-primary" id="place-all-btn" type="button" hidden data-i18n="ui.orderPlaced">Order placed…</button>
    <!-- Start the order again. Shows from ONE supplier up, unlike the button above:
         in the flat list there are no per-supplier cards, so without it a single
         supplier could not be cleared at all. Quiet by design (P20) — it throws
         work away and must never compete with the green button. -->
    <button class="clear-all-btn" id="clear-all-btn" type="button" hidden data-i18n="ui.clearQuantities">Clear quantities…</button>
  </section>

  <!-- INCOMING — what has been ordered and has not been confirmed as arrived.
       ⚠️ Nothing here is deduced from the supplier's delivery days: an order leaves
       this list when somebody says it turned up, and never on its own. Deducing it
       would drop an order off the day it was due, so the one that NEVER came would
       be the only one nobody ever sees. -->
    <section class="content" id="tab-deliveries">
      <div id="deliveries-list"></div>
    </section>
  </div>
  </div>

  <!-- HISTORY — reached from Settings, not from the tab bar.
       ⚠️ Deliberately NOT .preview-overlay: that class is in BUSY_SELECTORS and
       would postpone a COMPULSORY update for as long as this stayed open. Nothing
       is lost by a reload here, so nothing here may hold an update back. The record
       EDITOR inside it uses .hist-edit-list, which is in that list and should be. -->
  <div class="history-overlay" id="history-overlay" hidden>
    <header class="app-header orders-header">
      <span class="app-header-slot">
        <button class="app-icon-btn orders-icon-btn" id="history-back-btn" type="button" data-i18n="ui.back" data-i18n-attr="aria-label" aria-label="Back"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      </span>
      <div class="app-header-title orders-header-title"><h1 data-i18n="ui.history">History</h1></div>
      <span class="app-header-slot" aria-hidden="true"></span>
    </header>
    <div class="scroll-area">
      <section class="content active" id="tab-history">
        <!-- History's own status line: this overlay covers the page's, so a message
             about something done from here is written here (js/orders/orders-main.js
             statusElement). -->
        <p class="orders-status" id="history-status" role="status" hidden></p>
        <div id="history-list"></div>
      </section>
    </div>
  </div>

  <!-- ⚠️⚠️ ONE BUTTON, CENTRED (Federico, 24 Aug 2026). History moved INSIDE
       Settings, and «Fornitori» left altogether — it was the SECOND door to
       suppliers.html and the first, the card on the Home, is untouched.
       ⚠️ The bar is DERIVED from its children (see registry-main.js): no visible
       button, no bar. Never typed by hand. -->
  <div class="recipe-footer" id="orders-footer">
    <button class="recipe-footer-btn" id="settings-footer-btn" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span data-i18n="ui.settings">Settings</span></button>
  </div>

</div>

<!-- Offline bar: shown ONLY while the device has no network connection
     (js/orders/orders-main.js toggles [hidden] on the browser online/offline
     events). Fixed to the bottom so it stays visible whatever the scroll. -->
<p class="orders-offline" id="orders-offline" role="status" hidden data-i18n="ui.youReOfflineReconnect">You’re offline — reconnect to load and save orders.</p>

<script type="module" src="js/i18n-dom.js"></script>
<script type="module" src="js/auth-gate.js"></script>
<script type="module" src="js/sw-update.js"></script>
<script type="module" src="js/idle-reset.js"></script>
<script type="module" src="js/orders/boot.js"></script>
<script type="module" src="js/orders/orders-main.js"></script>
<script type="module" src="js/help-button.js"></script>
<script type="module" src="js/hold-to-zoom.js"></script>
</body>
</html>
