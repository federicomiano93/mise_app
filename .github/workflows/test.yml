name: Tests

# The owner cannot review code, so these automated tests are the main safety net
# against regressions (P15). They run on every push and pull request.
#
# ⚠️ EVERY `uses:` IS PINNED TO A COMMIT, NEVER A TAG: whoever controls an action's repository
# can move `@v5` to new code, and here that code runs beside production's deploy credential
# (deploy-functions). The version stays as a comment; .github/dependabot.yml moves both
# together once a month, and tests/ci-actions-pinned.test.mjs refuses a tag.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # ⚠️ 22 IS NOT A PREFERENCE, IT IS THE VERSION THE SERVER RUNS. Every
      # deployed function is on nodejs22 and `functions/package.json` says
      # `"engines": { "node": "22" }`, so a CI on anything else tests the code on
      # a runtime nobody uses. It was on 20 until 10 Sep 2026 — by then out of
      # support since April, and the `npm ci` in the deploy job below was warning
      # EBADENGINE on every run. Move all three jobs together, and move them when
      # `functions/package.json` moves, not before.
      #
      # ⚠️ AND THAT INSTRUCTION IS NOW ENFORCED, because a comment is not a
      # fastener: tests/functions-runtime.test.mjs fails if any `node-version:`
      # here stops matching functions/package.json. It has to be, since the same
      # file goes red six months before a decommission and tells somebody to raise
      # package.json — at which point nothing else would make these lines follow.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      # No install step: the suite is pure Node with zero dependencies, run by the
      # built-in test runner (`node --test`, see package.json).
      - run: npm test
      # The owner's LOCAL invoice script (invoice-import/) is Python, not Node. Its tests
      # run here on invented invoices only: real invoices never go in this repository.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Invoice import script tests
        run: |
          python -m pip install -r invoice-import/requirements.txt
          python -m unittest discover -s invoice-import/tests -t invoice-import
      # ⚠️ THE SAME CHECK deploy-functions RUNS, MOVED FORWARD TO THE PULL REQUEST.
      # deploy-functions runs on EVERY push to main and refuses on a high advisory,
      # even when functions/ did not change — twice on 30 Sep 2026 a release went
      # live with the server half refused, and each time a separate lockfile PR had
      # to follow. Here the same advisory turns the PR red BEFORE the merge, while
      # the fix can still ride with it. Same level, same reasoning as the deploy
      # step below. `npm audit` reads the lockfile, so no install is needed.
      - name: Vulnerability check of the server's dependencies (P11)
        run: npm audit --audit-level=high
        working-directory: functions

      # The one build tool (esbuild, developer machine only) is a devDependency of the root
      # package; `npm audit` reads package-lock.json, so this needs no install.
      - name: Vulnerability check of the build tool (P11)
        run: npm audit --audit-level=high

      # ⚠️ CI's OWN firebase-tools (ci/firebase-tools/ — the copy `rules` and deploy-functions
      # below and preview.yml run) needs a gate of its own, NOT `npm audit --audit-level=…`:
      # `high` is red for ever (two denial-of-service advisories no firebase-tools release
      # fixes), and `critical` misses a HIJACKED package — the September 2025 takeovers of
      # debug and color-convert were published as HIGH. The script fails on any «malicious
      # code» advisory at any severity and on any high or critical except the two it names
      # with their reasons; why each is harmless to CI is written there. A failure turns every
      # PR and the push to main red, and deploy-functions (which needs this job) cannot run.
      # It reads the lockfile only, no install. Dependabot reports every level as well.
      - name: Vulnerability check of CI's firebase-tools (P11)
        run: node scripts/audit-ci-firebase-tools.mjs

  # The security rules are the app's ONLY boundary between two businesses sharing
  # one database, and until now their suite ran only when somebody remembered to
  # run it by hand. It needs the Firebase emulator, so it cannot ride in the job
  # above (`node --test` deliberately does not discover tests/rules/*.mjs).
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      # The Firestore emulator is a Java program. 21 is the current LTS and the
      # version this was verified on locally.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      # The emulator jars are downloaded on first use (~100 MB) and never change
      # for a given firebase-tools release, so they are cached against the pinned
      # version (ci/firebase-tools/package.json — tests/ci-install-before-sign-in.test.mjs
      # keeps the two equal). A cache miss only costs time, never correctness.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.26.0

      # PINNED ON PURPOSE, AND LOCKED. firebase-tools ships the emulator itself, so
      # an unpinned `@latest` would silently change the thing under test between two
      # runs of the same commit — a red build nobody changed anything to cause,
      # and the opposite of what a safety net is for. The version lives in
      # ci/firebase-tools/package.json and every package under it in that folder's
      # lockfile (its README says how to raise it). Raise it deliberately, and
      # re-run the suite locally when you do.
      #
      # Exactly the install the two jobs that hold a Google credential use
      # (deploy-functions below, preview.yml) — the lockfile, no install scripts,
      # only `firebase` on PATH (why: deploy-functions) — so this job proves on
      # every push that the locked firebase-tools still runs the emulator without
      # its install scripts. (The deploy commands are proven by
      # each PR's Preview run and, for functions, by deploy-functions after the
      # merge.) Change one, change all three.
      - name: Install firebase-tools from its lockfile (no install scripts)
        run: |
          npm ci --ignore-scripts
          mkdir "$RUNNER_TEMP/firebase-cli"
          ln -s "$PWD/node_modules/.bin/firebase" "$RUNNER_TEMP/firebase-cli/firebase"
          echo "$RUNNER_TEMP/firebase-cli" >> "$GITHUB_PATH"
        working-directory: ci/firebase-tools

      # --project demo-theitalianclub: firebase-tools treats a `demo-` prefix as
      # offline-only — it looks for no credentials and can reach no real Firebase
      # project, so CI cannot touch production even by accident. The harness
      # defaults to the same id (tests/rules/seed-emulator.mjs).
      - run: firebase emulators:exec --only auth,firestore --project demo-theitalianclub "npm run test:rules"

  # ── Mise 2: the rewrite (app/ + shared/) ─────────────────────────────────────
  #
  # ITS OWN JOB, so the two checks above stay exactly what they were: `test` installs
  # nothing, while this one installs the new app's packages from its two lockfiles
  # (app/package-lock.json, shared/package-lock.json — never the root one).
  #
  # A REQUIRED CHECK on main since 10 Oct 2026, beside `test` and `rules` (his decision): a
  # red Mise 2 cannot be merged even though nothing under app/ reaches a phone before the
  # switch. `deploy-functions` below still needs only `test` and `rules` — this job never
  # gates the server deploy.
  mise2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      # The lockfiles decide, and no package may run code while it installs (each folder's
      # .npmrc says the same; the flag makes it true even if a .npmrc is lost).
      - name: Install shared/
        run: npm ci --ignore-scripts
        working-directory: shared
      - name: Install app/
        run: npm ci --ignore-scripts
        working-directory: app

      - name: shared/ — types
        run: npm run typecheck
        working-directory: shared
      # Each spec runs against the TypeScript port AND the current app's js/ model, so a fix
      # made to one and forgotten in the other turns this red.
      - name: shared/ — tests
        run: npm test
        working-directory: shared

      - name: app/ — types
        run: npm run typecheck
        working-directory: app
      - name: app/ — tests
        run: npm test
        working-directory: app
      - name: app/ — build
        run: npm run build
        working-directory: app

      # Same level and reasoning as the two audits in the `test` job.
      - name: Vulnerability check of shared/ (P11)
        run: npm audit --audit-level=high
        working-directory: shared
      - name: Vulnerability check of app/ (P11)
        run: npm audit --audit-level=high
        working-directory: app

  # ── The server half of the notifications ────────────────────────────────────
  #
  # ⚠️ `needs: [test, rules]` IS THE ENTIRE GUARANTEE OF THIS JOB, and it is the
  # reason it exists at all. `firebase deploy --only functions` publishes whatever
  # is on the machine it runs on — run by hand, it walks straight past the branch
  # protection and the two suites above, which is the one thing this project has
  # protected for two years. Here it cannot run until both are green.
  #
  # ⚠️ AND ONLY ON main, ONLY ON A PUSH. A pull request from anywhere must never
  # be able to publish code to the live project.
  deploy-functions:
    needs: [test, rules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # ⚠️ NO DOWNLOADABLE KEY EXISTS ANYWHERE. GitHub proves who it is with a token
    # it mints for this run, Google checks that claim and hands back a credential
    # that lasts minutes. Nothing permanent is stored here, in the repo, or on
    # anybody's laptop — so there is nothing to leak, nothing to rotate, and
    # nothing that keeps working after it has been stolen. It is what Google's own
    # warning on the "create key" page asks for.
    #
    # ⚠️ `id-token: write` IS WHAT MAKES IT POSSIBLE, and `contents: read` is what
    # keeps the rest of the token small. Both are needed: without the first the
    # exchange fails, and without naming them at all the job would get the default
    # broad set for nothing.
    permissions:
      contents: read
      id-token: write

    steps:
      # No git credential left in the workspace: the deploy needs none.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      # Reproducible: the lockfile decides, not whatever npm feels like today.
      # `--ignore-scripts`: see the firebase-tools step below. Measured on the
      # 10 Oct 2026 lockfile: the only install scripts are @firebase/util's (it
      # rewrites a stub that returns `undefined` into one that returns `undefined`
      # when FIREBASE_WEBAPP_CONFIG is unset) and protobufjs's (a warning) — the two
      # installs came out file-for-file identical otherwise.
      - name: Install
        run: npm ci --ignore-scripts
        working-directory: functions

      # ⚠️ `--audit-level=high` ON PURPOSE, AND THIS IS A JUDGEMENT WORTH RE-READING.
      #
      # ⚠️ THE REASON IT WAS FIRST WRITTEN IS GONE, AND THE LEVEL STAYS ANYWAY.
      # It was set to `high` because the install then carried 8 MODERATE advisories,
      # all the same unreachable `uuid` issue inside Google's own chain, with no
      # fixed version — a permanently red job teaches people to ignore it. On
      # 10 Sep 2026 firebase-functions went 6.5.0 → 7.3.2 and firebase-admin
      # 13.6.0 → 14.3.0, and the tree is now CLEAN: `npm audit` reports 0.
      #
      # So `moderate` is finally reachable — and it is still not what this job
      # wants, for a reason that has nothing to do with how clean the tree is.
      # THIS JOB DEPLOYS THE FUNCTIONS; GITHUB PAGES DEPLOYS THE APP, in its own
      # workflow this file cannot see. A blocked deploy here therefore does not
      # stop a release — it ships the app WITHOUT the server half, which is
      # exactly the split that went unnoticed for hours on 13 Aug 2026. Paying
      # that price for a moderate advisory nobody can act on before Monday is a
      # bad trade; Dependabot already reports every moderate, which is how the
      # `qs` chain closed in the commit before this one was found in the first
      # place — a nightly failure nobody had to be looking for.
      #
      # A HIGH or CRITICAL still stops the deploy. Raise the level to `moderate`
      # only together with a way to hold BOTH halves back, never on its own.
      - name: Vulnerability check (P11)
        run: npm audit --audit-level=high
        working-directory: functions

      # ⚠️ NO PACKAGE IN THIS JOB RUNS CODE WHILE IT INSTALLS, EVERYTHING IS
      # INSTALLED BEFORE THE SIGN-IN, AND EVERY VERSION COMES FROM A LOCKFILE. The
      # sign-in below writes a short-lived credential to the LIVE project into the
      # workspace and points GOOGLE_APPLICATION_CREDENTIALS at it, and npm runs
      # install scripts by default — the usual way a hijacked npm package steals
      # whatever it finds on the machine. Until October 2026 firebase-tools was
      # installed inside the Deploy step, and the `npm ci` above ran, AFTER the
      # sign-in.
      #
      # ⚠️ `--ignore-scripts` IS THE PROTECTION, THE ORDER ONLY HELPS. A script
      # allowed to run before the sign-in could leave a process behind that waits
      # for the credential file to appear, so the order alone would not do. Every
      # install in this job skips install scripts, and nothing is installed after
      # the sign-in (both pinned by tests/ci-install-before-sign-in.test.mjs).
      #
      # It costs nothing here, measured on 15.26.0: the only install scripts in its
      # tree are protobufjs's (prints a version warning), re2's (an optional native
      # regex engine that only the local hosting emulator uses, falling back to
      # JavaScript's own) and fsevents's (macOS only). The `rules` job installs it
      # the same way, which proves on every push that the emulator still runs.
      #
      # ⚠️ AND THE LOCKFILE IS WHAT KEEPS A NEW VERSION OUT. firebase-tools ships
      # no npm-shrinkwrap.json, so the global `npm install firebase-tools@15.26.0`
      # this step replaced (October 2026) resolved its ~670 packages afresh on every
      # run: a hijacked new patch of any of them could have run during the deploy
      # below, with the credential. ci/firebase-tools/package-lock.json fixes every
      # version and its integrity hash; a new one arrives only through a reviewed PR.
      #
      # ⚠️ ONLY THE `firebase` COMMAND GOES ON PATH — a link in $RUNNER_TEMP, never
      # the whole node_modules/.bin. GITHUB_PATH puts a folder AHEAD of the system's
      # for every later step, post-steps included, and that folder holds ~30 other
      # names (glob, semver, rimraf, node-gyp…): one day's tree could carry a `git`
      # or a `curl` and silently replace it in the steps that hold the credential.
      #
      # What it does NOT cover: the code of firebase-tools and of the functions'
      # packages still RUNS with the credential during the deploy — it is the
      # deploy. The two lockfiles fix WHICH code that is; neither proves it harmless.
      - name: Install firebase-tools from its lockfile (before the sign-in, no install scripts)
        run: |
          npm ci --ignore-scripts
          mkdir "$RUNNER_TEMP/firebase-cli"
          ln -s "$PWD/node_modules/.bin/firebase" "$RUNNER_TEMP/firebase-cli/firebase"
          echo "$RUNNER_TEMP/firebase-cli" >> "$GITHUB_PATH"
        working-directory: ci/firebase-tools

      # ⚠️ THE TRUST IS PINNED TO THIS REPOSITORY, on Google's side, in TWO
      # PLACES. Both must name it or the exchange fails:
      #   1. the provider's attribute condition —
      #        assertion.repository == 'federicomiano93/mise_app'
      #   2. the service account's own IAM policy, which is what lets that
      #      repository impersonate it —
      #        …/attribute.repository/federicomiano93/mise_app
      # Without them ANY repository on GitHub could ask for, and get, a credential
      # to this project. It is the whole security model of this job and it does
      # not live in this file — read both with:
      #   gcloud iam workload-identity-pools providers describe github-provider \
      #     --location=global --workload-identity-pool=github-pool
      #   gcloud iam service-accounts get-iam-policy \
      #     github-deploy@bakery-app-ebf90.iam.gserviceaccount.com
      #
      # ⚠️ RENAMING THE REPOSITORY BREAKS THIS JOB, and this comment used to name
      # only place 1. On 13 Aug 2026 the_italian_club_app became mise_app, place 1
      # was repointed, and the deploy went on failing — the error names neither
      # place, so the second was found only by looking for it. Every push to main
      # failed for hours while `test` and `rules` stayed green, so the failure
      # e-mail said "Tests" and the tests were never the problem.
      #
      # ⚠️ EACH MUST NAME EXACTLY ONE REPOSITORY. Adding the new name beside the
      # old one is the tempting way to make a rename painless, and it leaves the
      # abandoned repository able to deploy to this project for ever.
      - name: Sign in to Google (no key)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: bakery-app-ebf90
          workload_identity_provider: projects/27778450817/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@bakery-app-ebf90.iam.gserviceaccount.com

      - name: Deploy
        run: firebase deploy --only functions --project bakery-app-ebf90 --non-interactive
