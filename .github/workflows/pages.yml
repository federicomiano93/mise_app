name: Pages

# What GitHub Pages serves at https://federicomiano93.github.io/mise_app/ once Mise 2 has replaced the current app.
#
# ⚠️ IT TAKES EFFECT ONLY AT THE SWITCH, AND ONLY WITH HIS CLICK. This file lives on the Mise 2 release branch, so it
# reaches main only when the release PR (#491) is merged; and Pages publishes what this workflow deploys only once its
# source is «GitHub Actions» (Settings → Pages → Build and deployment → Source), his click at the switch hour
# (docs/switch-runbook.md). Until then Pages publishes the committed files of main, as it always has, and the deploy job
# below — which runs only on main — never runs.
#
# What it publishes (scripts/build-pages-site.mjs): Mise 2's build at the root (its index.html, and its sw.js at the
# current app's address: that is the switch), the current app's order.html, reset-password.html and install-guide.html
# with every file they load, unchanged, a stub at every other old page that opens the same screen in Mise 2, and
# nothing internal. On every pull request the same site is built and its file list kept as an artifact
# (`site-listing`), so the switch is proved before it happens; nothing is deployed from a pull request.
#
# ⚠️ BUILT WHERE NO CREDENTIAL EXISTS, DEPLOYED BY A JOB THAT INSTALLS NOTHING — the same split as preview.yml: building
# Mise 2 runs the code of a few hundred npm packages, so the build job may only read the repository; the deploy job
# holds the Pages token and runs GitHub's own deploy action, no checkout, no npm.
#
# Not a required check: a broken build of the site must never block a fix to the app staff use today.
# Every `uses:` is pinned to a commit, never a tag (why: the top of test.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time, never cancelled halfway; a pull request's build may be replaced by its next push.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      # The lockfiles decide; no package may run code while it installs.
      - run: npm ci --ignore-scripts
        working-directory: shared
      - run: npm ci --ignore-scripts
        working-directory: app
      # At the site's own address: the worker's scope and every URL in the build depend on it.
      - name: Build Mise 2 for /mise_app/
        run: npm run build -- --base=/mise_app/
        working-directory: app
      - name: The service worker matches the build
        run: node sw/verify-build.mjs dist
        working-directory: app
      # ⚠️ pipefail: without it the step's result is tee's (always success), and a site the script refused would deploy.
      - name: Assemble the site
        run: |
          set -o pipefail
          node scripts/build-pages-site.mjs _site app/dist | tee "$RUNNER_TEMP/site-listing.txt"
      # ⚠️ Nothing internal, no symlink: what is published is public at once.
      - name: Prove nothing internal is in the site
        run: |
          leaked=""
          for path in .git .github firebase.json firestore.rules package.json functions app shared tests scripts docs \
                      ci invoice-import print-agent CLAUDE.md README.md .claude; do
            [ -e "_site/$path" ] && leaked="$leaked $path"
          done
          if [ -n "$leaked" ]; then echo "::error::in the site but must not be:$leaked"; exit 1; fi
          if [ -n "$(find _site -type l)" ]; then echo "::error::symlink in the site:"; find _site -type l; exit 1; fi
          [ "$(head -c 200 _site/sw.js | grep -c 'GENERATED by app/sw-plugin.ts')" = 1 ] || { echo "::error::sw.js is not Mise 2's"; exit 1; }
          cmp -s order.html _site/order.html || { echo "::error::order.html differs from the committed one"; exit 1; }
          cmp -s reset-password.html _site/reset-password.html || { echo "::error::reset-password.html differs"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-listing
          path: ${{ runner.temp }}/site-listing.txt
          if-no-files-found: error
          retention-days: 30
      # The site itself, for the deploy job: only where it will be deployed.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: pages-site
    # ⚠️ ONLY main, NEVER A PULL REQUEST. And it fails (changing nothing) while Pages' source is still «Deploy from a
    # branch»: that is the setting he switches at the switch hour.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
