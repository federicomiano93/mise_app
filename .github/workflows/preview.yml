name: Preview

# One link per pull request, so Federico can open the change on his phone BEFORE it goes live.
# It publishes the PR's pages to a Firebase Hosting preview channel of the PREVIEW project
# (mise-app-preview — fake data only), deploys the PR's Firestore rules THERE, and writes the
# link on the pull request; when the PR closes, it deletes that channel (job `delete-channel`).
# js/firebase-target.js makes those pages talk to the preview project and draw the «preview ·
# test data» ribbon.
#
# ⚠️ IT CANNOT TOUCH PRODUCTION, and not by convention: the Google credential below belongs to
# the preview project (its own workload identity pool, its own service account, whose roles are
# Hosting admin, Rules admin and read-only viewers — on that project only). Production's deploy
# lives in test.yml, behind `test` + `rules` and the push to main.
#
# ⚠️⚠️ ONLY THE APP'S OWN FILES ARE PUBLISHED, FROM GIT, NEVER THE WORKSPACE. The first version
# uploaded the checkout folder, and with it `.git/config` (the job's GitHub token) and the
# `gha-creds-*.json` file the sign-in step writes there — on a public address, for anyone who
# read the public Actions log (30 Sep 2026; the channel was deleted and that trust disabled and
# replaced within the hour; the audit log shows no use but the job's own). So: `git archive` of
# an ALLOWLIST into `_site/` (no dot-folder, no workspace file can get in), checkout without
# persisted credentials, the deploy output kept in $RUNNER_TEMP, and a check after every deploy
# that fails — and takes the channel down — if anything internal answers.
#
# This job is NOT a required check: a broken preview must never block a fix from shipping.

# `closed` runs ONLY `delete-channel`; every other job is skipped on it by its own `if:`.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One run per PR at a time: a close cancels a deploy still running for the same PR, so the
# channel is deleted after its last upload, never before it.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Mise 2, built where no credential exists ───────────────────────────────────────────────
  #
  # ⚠️ THE NEW APP IS BUILT IN ITS OWN JOB, WITH NO GOOGLE IDENTITY. Building it installs a few
  # hundred npm packages and runs their code (Vite and its plugins). The `preview` job below can
  # mint a credential for the preview project (`id-token: write`), and any code running there
  # could ask for one too. Here nothing can: this job may only read the repository, and what it
  # hands on is the built files, nothing else. Never merge the two jobs to save a minute.
  build-mise2:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The lockfiles decide; no package may run code while it installs.
      - run: npm ci --ignore-scripts
        working-directory: shared
      - run: npm ci --ignore-scripts
        working-directory: app
      # Served at /mise2/ on the preview, beside the current app at the root.
      - run: npm run build -- --base=/mise2/
        working-directory: app
      - uses: actions/upload-artifact@v7
        with:
          name: mise2-site
          path: app/dist
          if-no-files-found: error
          # As long as the PR's own channel lives: re-running only the preview job days later
          # must still find the files.
          retention-days: 14

  preview:
    needs: build-mise2
    # A PR from a fork gets no identity token, and must not get a public link to our code path.
    #
    # ⚠️ `!cancelled()`: THE CURRENT APP'S PREVIEW NEVER WAITS ON MISE 2. Without it a failed
    # Mise 2 build (or an npm registry blip) would take away the preview link of every fix to
    # the app staff use today — and that link is how he checks a fix on his phone before it
    # goes live. A failed build only leaves /mise2/ out; `cancelled` still stops everything.
    # ⚠️ And `!cancelled()` also runs this job when build-mise2 was SKIPPED — which it is on
    # `closed` — so the close must be refused here too, or a merged PR would be redeployed.
    if: ${{ !cancelled() && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      fixed_url: ${{ steps.deploy.outputs.fixed_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Mise 2's built files from the job above — outside the workspace until staged below.
      - if: needs.build-mise2.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: mise2-site
          path: ${{ runner.temp }}/mise2-site

      # The app, and nothing else: the pages, their stylesheets, sw.js, the manifest, js/, dist/
      # (the bundles every page loads: without it each page's script is a 404) and the static folders — exactly what GitHub Pages serves the app from. `:(glob)` keeps
      # `*.html` / `*.css` to the top level. Then Mise 2's BUILT files (never its source) at /mise2/.
      - name: Stage only the app's files
        run: |
          rm -rf _site && mkdir _site
          git archive --format=tar HEAD -- \
            ':(glob)*.html' ':(glob)*.css' sw.js manifest.json qr.png js dist icons fonts sounds \
            | tar -x -C _site
          if [ -d "$RUNNER_TEMP/mise2-site" ]; then
            mv "$RUNNER_TEMP/mise2-site" _site/mise2
          fi
          # ⚠️ No symlinks: firebase-tools FOLLOWS them when it uploads, so a committed
          # `js/x -> ../..` would publish the workspace — credentials file included.
          if [ -n "$(find _site -type l)" ]; then
            echo "::error::symlink in the staged site:"; find _site -type l; exit 1
          fi
          find _site -maxdepth 1 | sort

      # ⚠️ firebase-tools RUNS NO CODE WHILE IT INSTALLS, AND IS INSTALLED IN ITS OWN STEP BEFORE THE
      # SIGN-IN — the same rule, and the same measurement, as production's deploy job (test.yml,
      # deploy-functions). The sign-in below writes a credential into the workspace; this install
      # has no lockfile and install scripts run by default, so until October 2026, when it
      # ran inside the deploy step, any install script among its ~670 packages could have read
      # that credential. `--ignore-scripts` is the protection, the order only helps; both are
      # pinned by tests/ci-install-before-sign-in.test.mjs. Not covered: firebase-tools' own code
      # still runs with the credential during the deploy — it is the deploy tool.
      - name: Install firebase-tools (before the sign-in, no install scripts)
        run: npm install --global --ignore-scripts firebase-tools@15.26.0

      # ⚠️ The trust is pinned to this repository on Google's side, in TWO places, exactly like
      # production's (see test.yml): the provider's attribute condition
      #   assertion.repository == 'federicomiano93/mise_app'
      # and the service account's IAM policy (…/attribute.repository/federicomiano93/mise_app).
      # Renaming the repository breaks this job until BOTH are repointed.
      - name: Sign in to Google (no key) — the PREVIEW project only
        uses: google-github-actions/auth@v2
        with:
          project_id: mise-app-preview
          workload_identity_provider: projects/863348756512/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: preview-deploy@mise-app-preview.iam.gserviceaccount.com

      # ⚠️ TWO CHANNELS, THE SAME FILES. `pr-<n>` is this PR's own link. `anteprima` is ONE FIXED
      # link that always shows the most recently updated PR (Federico, 3 Oct 2026: «non voglio
      # mettere sempre le credenziali»): every channel is a different web.app subdomain, so a
      # phone treats each PR link as a new site and asks him to sign in again; on the fixed one
      # he signs in once per phone and stays signed in. Its expiry is pushed to 30 days (the
      # maximum) on every deploy, so the address only changes after a month with no PR at all.
      # Never the preview project's live site, and never a sign-in secret baked into the pages: the
      # address is public.
      - name: Deploy this PR's rules and pages to its preview channel and the fixed one
        id: deploy
        env:
          CHANNEL: pr-${{ github.event.pull_request.number }}
        run: |
          firebase deploy --only firestore:rules --project mise-app-preview --non-interactive
          link() { node -e "const r=require(process.argv[1]);const hit=Object.values(r.result||{}).find(v=>v&&v.url);if(!hit){console.error(JSON.stringify(r).slice(0,500));process.exit(1)}console.log(hit.url)" "$1"; }
          # `--json` writes a failed deploy's error INTO the file, and `bash -e` stops before
          # `link` reads it: on 11 Oct 2026 a full channel quota failed every new PR's preview
          # with nothing in the log but «exit 1». So a failed deploy prints Google's answer.
          failed() { echo "::error::channel $1 was not deployed: $(head -c 500 "$2" | tr -s '\n ' ' ')"; exit 1; }
          firebase hosting:channel:deploy "$CHANNEL" --only preview --project mise-app-preview \
            --expires 14d --non-interactive --json > "$RUNNER_TEMP/channel.json" || failed "$CHANNEL" "$RUNNER_TEMP/channel.json"
          url=$(link "$RUNNER_TEMP/channel.json")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          firebase hosting:channel:deploy anteprima --only preview --project mise-app-preview \
            --expires 30d --non-interactive --json > "$RUNNER_TEMP/fixed.json" || failed anteprima "$RUNNER_TEMP/fixed.json"
          fixed=$(link "$RUNNER_TEMP/fixed.json")
          echo "fixed_url=$fixed" >> "$GITHUB_OUTPUT"

      - name: Prove nothing internal is being served
        env:
          PR_CHANNEL: pr-${{ github.event.pull_request.number }}
          PR_URL: ${{ steps.deploy.outputs.url }}
          FIXED_URL: ${{ steps.deploy.outputs.fixed_url }}
          MISE2_BUILT: ${{ needs.build-mise2.result == 'success' }}
        # Every path is checked BEFORE any verdict, so nothing can skip the leak check; a curl
        # that fails answers 000, which counts as served — the safe direction. BOTH channels are
        # checked (they carry the same files, but each is its own upload), and the one that
        # leaks is taken down.
        run: |
          check() {
            CHANNEL="$1"; URL="$2"
            code() { curl -s --max-time 15 -o /dev/null -w "%{http_code}" "$URL/$1"; }
            leaked=""
            for path in .git/config .git/HEAD .github/workflows/preview.yml .claude/settings.json \
                        firebase.json firestore.rules package.json functions/index.js \
                        scripts/seed-preview.mjs tests/firebase-target.test.mjs README.md \
                        app/package.json app/src/main.tsx shared/package.json \
                        mise2/package.json mise2/src/main.tsx; do
              [ "$(code "$path")" = 404 ] || leaked="$leaked $path"
            done
            for creds in gha-creds-*.json; do
              [ -e "$creds" ] && { [ "$(code "$creds")" = 404 ] || leaked="$leaked $creds"; }
            done
            if [ -n "$leaked" ]; then
              echo "::error::served but must not be:$leaked — taking the channel down"
              firebase hosting:channel:delete "$CHANNEL" --project mise-app-preview --force
              exit 1
            fi
            [ "$(code index.html)" = 200 ] || { echo "::error::index.html is not served on $CHANNEL"; exit 1; }
            if [ "$MISE2_BUILT" = true ]; then
              [ "$(code mise2/index.html)" = 200 ] || { echo "::error::Mise 2 is not served on $CHANNEL"; exit 1; }
            fi
          }
          check "$PR_CHANNEL" "$PR_URL"
          check anteprima "$FIXED_URL"

  # The comment gets its own job: the only one allowed to write on the PR, and it installs and
  # runs nothing but `gh`.
  comment:
    needs: [build-mise2, preview]
    if: ${{ !cancelled() && needs.preview.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Put the link on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ needs.preview.outputs.url }}
          FIXED_URL: ${{ needs.preview.outputs.fixed_url }}
          MISE2: ${{ needs.build-mise2.result }}
        run: |
          if [ "$MISE2" = success ]; then
            mise2="**Mise 2**, la nuova app in costruzione (per ora solo la pagina delle fondamenta, senza dati): $FIXED_URL/mise2/"
          else
            mise2="**Mise 2**: in questa PR la nuova app non si è costruita, quindi manca dall'anteprima. L'app di oggi qui sopra non ne risente."
          fi
          body="**Anteprima di questa PR** (dati di prova, non i tuoi): $URL
          **Link fisso**, sempre l'ultima PR aggiornata — entri una volta per telefono e resti dentro: $FIXED_URL
          Aprila sul telefono ed entra con un account di prova. Il link della PR si aggiorna a ogni modifica e scade dopo 14 giorni, o appena la PR si chiude; quello fisso cambia solo dopo 30 giorni senza PR. In anteprima non funziona ciò che passa dal server: codici d'invito, alcuni interruttori delle impostazioni, notifiche, lettura da foto.
          $mise2"
          gh pr comment "$PR" --edit-last --body "$body" || gh pr comment "$PR" --body "$body"

  # ── When the PR closes, its own channel goes ───────────────────────────────────────────────
  #
  # ⚠️ FIREBASE HOSTING ALLOWS 50 PREVIEW CHANNELS PER SITE, AND A FULL QUOTA FAILS THE PREVIEW OF
  # EVERY NEW PR. Each `pr-<n>` used to outlive its PR by up to 14 days; with several PRs a day
  # the site reached 50 on 11 Oct 2026, and creating a channel answered «429 … channel quota
  # reached». So a closed PR — merged or not — takes its own channel down at once. The fixed
  # `anteprima` channel is never deleted here. A channel already gone (expired, deleted by hand,
  # never created because its deploy failed) is not an error. The 14-day expiry stays as the
  # net: GitHub runs no pull_request workflow for a PR closed while it has a merge conflict.
  #
  # ⚠️ NOTHING IS CHECKED OUT AND NOTHING IS INSTALLED: one call to the Hosting API with the
  # short-lived token the sign-in hands back, so no third-party code runs next to the credential
  # (the deploy job cannot avoid firebase-tools; this job can). firebase-tools' own channel delete
  # would also need firebase.json, so a checkout of a PR that is already closed. It would also
  # try to remove the channel's address from Firebase Auth's authorized domains, but none is
  # ever there: the account may not change Auth settings, so the deploy's attempt to add it
  # fails quietly (the list held only localhost and the project's own two addresses, 11 Oct 2026).
  delete-channel:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      # The same trust and the same service account as the preview job (pinned in TWO places on
      # Google's side — see that job). No credentials file and nothing exported: the token goes
      # only to the step below, masked in the log, and dies within five minutes.
      - name: Sign in to Google (no key) — the PREVIEW project only
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: mise-app-preview
          workload_identity_provider: projects/863348756512/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: preview-deploy@mise-app-preview.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      # 200 = deleted, 404 = already gone; any other answer fails the job and prints Google's.
      - name: Delete this PR's channel (never the fixed one)
        env:
          CHANNEL: pr-${{ github.event.pull_request.number }}
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          code=$(curl -sS --max-time 30 --retry 3 -X DELETE -o "$RUNNER_TEMP/delete.json" -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://firebasehosting.googleapis.com/v1beta1/sites/mise-app-preview/channels/$CHANNEL")
          case "$code" in
            200) echo "$CHANNEL deleted" ;;
            404) echo "$CHANNEL was already gone" ;;
            *) echo "::error::$CHANNEL was not deleted (HTTP $code): $(head -c 500 "$RUNNER_TEMP/delete.json" | tr -s '\n ' ' ')"; exit 1 ;;
          esac
