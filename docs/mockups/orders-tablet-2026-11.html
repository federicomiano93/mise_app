<!doctype html>
<!--
  Agreed mockup of the Mise 2 Orders screen on the lab tablet (1024x744, landscape, full screen), built with Federico
  on 16 Nov 2026 step by step on the real SM-T550. It is the visual spec for branch feature/orders-tablet-layout;
  the written spec is the plan in the PR description. Names are fake on purpose (no business data in the repo).
  Open it in a browser at 1024 wide; the MOCKUP pill (bottom right) is mockup-only. Not served by Pages (docs/ is excluded).
-->
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup Ordini · Mise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>

.grid{gap:0;margin:-20px -32px -32px;align-items:stretch;grid-template-columns:344px minmax(0,1fr)}

.rail{width:104px;gap:6px;padding:14px 8px}

.cr.pane{min-height:calc(100vh - 210px)}

.hintl{height:48px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink2);font-size:15px}

.sbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.ol{font-size:14px;color:var(--ink2);font-weight:500}

.lin .n{font-weight:600;font-size:15px;line-height:1.25}.lin .w{font-size:13px;color:var(--ink3);margin-top:2px}

.sv{flex:1;height:44px;border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:var(--ink)}

.cr.pane.supopen{background:#fff}
.supopen .ph,.supopen .li,.supopen .li.has{background:#fff}
.supopen .ib,.supopen .ds,.supopen .un,.supopen .stp,.supopen .gz{background:#f1efea;border-color:transparent}
.supopen .sv{border-color:#fff}
.supopen .li.has .stp{background:var(--atint)}.supopen .li.has .sv{color:var(--aink)}
.supopen .ph,.supopen .sbar,.supopen .lh,.supopen .li{border:0}
.supopen .li{min-height:60px}
.supopen .lh{height:30px}
.supopen .sbar{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px}
.dlgw{position:fixed;inset:0;background:rgba(27,25,22,.35);display:flex;align-items:center;justify-content:center;z-index:20}
.dlg{background:#fff;border-radius:20px;padding:24px;width:440px;box-shadow:0 24px 64px rgba(0,0,0,.2)}
.dlg h2{font-size:22px;margin:0 0 18px;font-weight:700}
.opt{width:100%;height:56px;border:1px solid var(--line2);border-radius:14px;background:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:17px;font-weight:600;margin-bottom:10px;text-align:left}
.opt svg{width:22px;height:22px;color:var(--ink2)}
.opt small{display:block;font-size:13px;font-weight:400;color:var(--ink3)}
.dlgf{display:flex;justify-content:flex-end;margin-top:8px}
.dlgf button{height:48px;border:1px solid var(--line2);border-radius:12px;background:#fff;padding:0 18px;font-size:16px}

.dlgf{gap:10px}
.dlgf .send{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:8px}.dlgf .send svg{width:18px;height:18px}
.aw{display:flex;align-items:center;gap:12px;background:var(--wtint);border:1px solid var(--warn);border-radius:14px;padding:10px 12px 10px 16px;margin:0 0 16px;font-size:16px;color:var(--wink)}

.awb{flex:1;height:56px;border-radius:14px;border:1px solid var(--line2);background:#fff;font-size:18px;font-weight:600}.awb.y{background:var(--accent);color:#fff;border-color:var(--accent)}
</style></head><body>
<div class="app"><nav class="rail" id="rail"></nav><div class="main" id="main"></div></div>
<div class="mk">MOCKUP<button id="railb">Barra chiara</button><button id="offb">Simula offline</button></div>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
var S={scr:'orders',pane:'ov',off:false,aw:true};
var I=function(n){return '<i data-lucide="'+n+'"></i>'};
var NAV=[['home','house','Home'],['orders','shopping-cart','Ordini'],['','truck','Fornitori'],['','book-open','Ricette'],['','tag','Etichette'],['','calculator','Calcolatore'],['','croissant','Paste'],['','warehouse','Magazzino'],['','chart-pie','Food cost']];
function rail(){var h='';NAV.forEach(function(n){h+='<button class="ri'+(n[0]===S.scr?' on':'')+'" data-go="'+n[0]+'">'+I(n[1])+n[2]+'</button>'});
h+='<div class="sp"></div><button class="ri">'+I('settings')+'Impostazioni</button><div class="av">A</div>';return h}
function off(){return S.off?'<div class="off">'+I('wifi-off')+'Offline: salvo qui e invio appena torna la rete</div>':''}
function row(n,o){o=o||{};return '<div class="row'+(o.due?(S.pane==='sup'?' cur':' due'):'')+'"><button class="ro" data-open="1"><div style="flex:1;min-width:0"><div class="nm">'+n+'</div>'+(o.meta?'<div class="mt">'+o.meta+'</div>':'')+(o.due||o.cnt?'<div style="display:flex;align-items:center;gap:8px;margin-top:4px;white-space:nowrap">'+(o.due?'<span class="tag" style="margin:0">Da ordinare oggi</span>':'')+(o.cnt?'<span class="cnt">'+o.cnt+'</span>':'')+'</div>':'')+'</div>'+I('chevron-right')+'</button><button class="rx" aria-label="Cosa vendono">'+I('list')+'</button>'+(o.cnt?'<button class="rx" aria-label="Riepilogo" data-open="1">'+I('clipboard-list')+'</button>':'<span style="width:48px;flex:none;border-left:1px solid var(--line)"></span>')+'</div>'}
function overview(){return ''}
function item(n,w,q){return '<div class="li'+(q?' has':'')+'"><div class="lin"><div class="n">'+n+'</div>'+(w?'<div class="w">'+w+'</div>':'')+'</div><div class="un">cartone'+I('chevron-down')+'</div><div class="stp"><span class="sb">'+I('minus')+'</span><span class="sv">'+(q||'')+'</span><span class="sb">'+I('plus')+'</span></div><div class="gz"></div></div>'}
function supplier(){return '<div class="ph"><button class="ib" data-close="1" aria-label="Chiudi">'+I('x')+'</button><span class="pt">ROSSI</span><button class="chev" aria-label="Scheda fornitore">'+I('chevron-right')+'</button><span class="sp"></span><button class="ib" aria-label="Invia" data-send="1">'+I('upload')+'</button></div><div class="sbar"><span class="ol">Ordine per</span><span class="ds">Oggi'+I('chevron-down')+'</span><span class="sp"></span><span class="saved" style="margin:0">Salvato ✓</span></div><div class="lh"><span>Articolo</span><span>Unità</span><span style="text-align:center">Ordine</span><span style="text-align:center">Giacenza</span></div>'+item('Cornetto','85 g','')+item('Treccia al cioccolato grande','170 g','1')+item('Treccia al cioccolato piccola','','')+item('Treccia alla crema grande','170 g','2')+item('Treccia alla crema piccola','','')+item('Sfogliatella','90 g','')}
function notices(){return '<div class="ph"><button class="ib" data-close="1" aria-label="Chiudi">'+I('x')+'</button><span class="pt">Avvisi</span></div><div class="ntc"><div class="nt"><b>Esempio di avviso</b><span>Qui compaiono gli avvisi della campanella, nella colonna destra.</span></div></div>'}
function orders(){var p=S.pane==='sup'?supplier():S.pane==='not'?notices():overview();
return '<div class="page"><div class="tr band"><h1>Ordini</h1><button class="ib" aria-label="Impostazioni">'+I('settings')+'</button><button class="ib" aria-label="Storico">'+I('history')+'</button><button class="ib'+(S.pane==='not'?' on':'')+'" data-bell="1" aria-label="Avvisi">'+I('bell')+'<span class="bd">1</span></button><button class="ib" aria-label="Liste d’ordine" style="width:auto;padding:0 14px;gap:8px;font-weight:500">'+I('list-checks')+'Liste d’ordine</button><span class="sp"></span>'+(S.pane==='sup'?'<span style="height:48px"></span>':'<button class="ib" aria-label="Invia" data-send="1">'+I('upload')+'</button>')+'</div>'+awaiting()+off()+
'<div class="g2"><div class="cl tp"><div class="seg"><button class="on">Fornitori</button><button>Ingredienti</button></div><div class="search" style="margin:0">'+I('search')+'Cerca un fornitore…</div></div>'+
'<div class="cr tp"><div class="seg" style="width:300px;margin:0 auto 12px"><button>'+I('package')+' In arrivo <span class="pill">2</span></button><button>'+I('rotate-ccw')+' Da riordinare</button></div>'+(S.pane==='ov'?'<div class="hintl"><b>Scegli un fornitore</b></div>':'')+'</div><div class="hl"></div><div class="cl">'+(S.pane==='sup'?'<div style="height:20px"></div>':'<div class="saved" style="margin:0 0 6px">Salvato ✓</div>')+''+
