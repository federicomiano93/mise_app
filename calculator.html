  THE ITALIAN CLUB PWA
  Repo:   https://github.com/federicomiano93/mise_app
  Deploy: https://federicomiano93.github.io/mise_app/

  Clients, products and per-client unit weights are configurable in Settings and
  stored in Firestore (config/calculator) — they are NOT hard-coded here. See
  js/calculator-config.js for the default structure and weights.

  ── FOCACCIA ──────────────────────────────────────────────
  Default unit weights: Pizzas 201g · Focaccias 181g · Ciabatta 151g ·
    Tray focaccia 1800g · Panini 131g · Kg 1000g (extra dough direct in kg)
  Scala base: 995.6g raw · Yeast default: 0.65%

  ── BRIOCHE ───────────────────────────────────────────────
  Default unit weights: Burger buns 81g · Sub rolls 121g · Buns 71g ·
    Rolls 71g · Kg 1000g (extra dough direct in kg)
  Scala base: 4887.4g raw · Yeast default: 4%

  ── SOURDOUGH ─────────────────────────────────────────────
  Input: numero pagnotte + peso per pagnotta (default 905g)
  Scala base: 10968g raw
  Starter default: 18%
  Ingredienti base (colonna gialla Excel):
    Flour uniqua blu  2560g
    Flour T65         2560g
    Flour wholemeal    570g
    1° Water          3900g
    Sourdough starter 1024g
    Malt                30g
    Salt               124g
    2° Water           200g

  ── NOTES ─────────────────────────────────────────────────
  Service worker: cache-first + background revalidate; updates surface as a
  tap-to-update banner via js/sw-update.js (shared by every page).
  Cache version lives in sw.js (CACHE_NAME) — bump it on every deploy.
  Icon: loaf on dark-green background, only updatable by reinstalling the PWA.
-->
<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<!--
  CSP bootstrap. A <meta> Content-Security-Policy cannot be loosened at runtime
  (multiple policies combine by intersection), so to allow the LOCAL Firebase
  emulator on localhost WITHOUT touching the live site's policy, the meta is
  emitted here. On the live domain the string is byte-identical to the production
  policy; on localhost only, connect-src additionally allows the Auth (9099) and
  Firestore (8080) and Functions (5001) emulators.
  ⚠️ THE FUNCTIONS ORIGIN HAD TO BE ADDED TO THE LIVE POLICY TOO. Until the
  onboarding calls, nothing in this app ever called a Cloud Function from a
  browser — the existing ones are triggered by Firestore, server to server — so
  connect-src had never needed it. Without it every callable fails with the
  client's generic 'internal', which says nothing about a blocked request. This inline script runs before any CSP is in effect
  (only <meta charset> precedes it) and before any network request.
-->
<script>
(function () {
  var local = ['localhost', '127.0.0.1', '::1', '[::1]'].indexOf(location.hostname) !== -1;
  var emu = local
    ? ' http://localhost:8080 http://localhost:9099 http://localhost:5001 http://127.0.0.1:8080 http://127.0.0.1:9099 http://127.0.0.1:5001'
    : '';
  document.write(
    '<meta http-equiv="Content-Security-Policy" content="' +
    "default-src 'self'; " +
    "script-src 'self' https://www.gstatic.com https://www.google.com; " +
    "connect-src 'self' https://www.gstatic.com https://www.google.com https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://us-central1-bakery-app-ebf90.cloudfunctions.net" + emu + "; " +
    "frame-src 'self' https://www.google.com; " +
    "img-src 'self' data:; " +
    "style-src 'self'; " +
    "font-src 'self'; " +
    // Neither is covered by default-src, so both have to be stated. base-uri stops
    // an injected <base> from re-pointing every relative URL on the page; the app
    // has no <form> at all, so form-action 'self' can only ever refuse something
    // that should not be there.
    "base-uri 'self'; " +
    "form-action 'self'" +
    '">'
  );
})();
</script>

    <div id="send-who-body"></div>
    <div class="loaf-modal-actions">
      <button class="send-who-cancel" data-i18n="people.cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Day picker: opened by a dough tab's Confirm button to choose which day to save the log for. -->
<div id="day-modal" role="dialog" aria-modal="true" aria-labelledby="day-modal-title">
  <div id="day-modal-box">
    <div class="loaf-modal-title" id="day-modal-title" data-i18n="ui.saveThisDoughFor">Save this dough for:</div>
    <div class="day-row">
      <button class="day-btn" type="button" data-day="today" data-i18n="ui.today">Today</button>
      <button class="day-btn" type="button" data-day="tomorrow" data-i18n="ui.tomorrow">Tomorrow</button>
    </div>
    <div class="loaf-modal-actions">
      <button class="loaf-modal-cancel" id="day-modal-cancel" data-i18n="people.cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Read-only view of a log: the full calculator sheet for that log (D). -->
<div id="logview-overlay" class="log-overlay">
  <div class="recipe-overlay-header">
    <button class="logview-back-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="recipe-overlay-title" id="logview-title" data-i18n="ui.log">Log</span>
    <button class="overlay-home-btn logview-home-btn" type="button" data-i18n="ui.home" data-i18n-attr="aria-label" aria-label="Home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/></svg>
    </button>
  </div>
  <div class="recipe-scroll"><div id="logview-content"></div></div>
</div>

<!-- Dedicated log-edit screen (B): editable quantities for the saved log. -->
<div id="logedit-overlay" class="log-overlay">
  <div class="recipe-overlay-header">
    <button class="logedit-back-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="recipe-overlay-title" data-i18n="ui.editLog">Edit log</span>
  </div>
  <div class="recipe-scroll"><div id="logedit-content"></div></div>
</div>

<!-- Manual add-log screen: pick a dough, enter quantities, save a new log. -->
<div id="logadd-overlay" class="log-overlay">
  <div class="recipe-overlay-header">
    <button class="logadd-back-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="recipe-overlay-title" data-i18n="ui.addLog">Add log</span>
  </div>
  <div class="recipe-scroll"><div id="logadd-content"></div></div>
</div>

<!-- Version history (C): past versions + restore. -->
<div id="loghistory-overlay" class="log-overlay">
  <div class="recipe-overlay-header">
    <button class="loghistory-back-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="recipe-overlay-title" data-i18n="ui.editHistory">Edit history</span>
    <span class="overlay-home-spacer"></span>
  </div>
  <div class="recipe-scroll"><div id="loghistory-content"></div></div>
</div>

<script type="module" src="js/location-title.js"></script>
<script type="module" src="js/i18n-dom.js"></script>
<script type="module" src="js/auth-gate.js"></script>
<script type="module" src="js/sw-update.js"></script>
<script type="module" src="js/idle-reset.js"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/help-button.js"></script>
<script type="module" src="js/hold-to-zoom.js"></script>
</body>
</html>
