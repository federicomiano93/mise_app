<!--
  MISE — choose a new password.
  The page the «Forgot your password?» email links to (Firebase console → Authentication →
  Templates → Customize action URL). Standalone: no venue is open, no section, no home.
  Firebase appends ?mode=…&oobCode=…&apiKey=…&lang=… to the address; js/reset-password-boot.js
  draws the card, hands every mode other than resetPassword (and any failure to load the real
  script, js/reset-password.js) on to Firebase's own page. sw.js never caches this address.
  Not in the manifest and not on the Home. In sw.js ASSETS so the page and the modules it
  imports come from the same cache.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- CSP: the same policy as index.html (see the note there for why it is written by a script:
     localhost additionally allows the Auth and Firestore emulators). -->
<script>
(function () {
  var local = ['localhost', '127.0.0.1', '::1', '[::1]'].indexOf(location.hostname) !== -1;
  var emu = local
    ? ' http://localhost:8080 http://localhost:9099 http://localhost:5001 http://127.0.0.1:8080 http://127.0.0.1:9099 http://127.0.0.1:5001'
    : '';
  document.write(
    '<meta http-equiv="Content-Security-Policy" content="' +
    "default-src 'self'; " +
    "script-src 'self' https://www.gstatic.com; " +
    "connect-src 'self' https://www.gstatic.com https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://us-central1-bakery-app-ebf90.cloudfunctions.net" + emu + "; " +
    "frame-src 'self'; " +
    "img-src 'self' data:; " +
    "style-src 'self'; " +
    "font-src 'self'; " +
    "base-uri 'self'; " +
    "form-action 'self'" +
    '">'
  );
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<meta name="theme-color" content="#2D5016">
<meta name="robots" content="noindex">
<!-- The address carries the one-time code, so it must not travel in a Referer to anybody else —
     but strict-origin, NOT no-referrer: the Firebase API key is restricted by HTTP referrer,
     and a call that arrives with none is refused. -->
<meta name="referrer" content="strict-origin">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="auth.css">
<title>Mise</title>
</head>
<body class="auth-page">

<!-- The same green panel as the sign-in screen; js/reset-password.js fills the card. -->
<div id="auth-gate" class="auth-gate"></div>

<script type="module" src="js/i18n-dom.js"></script>
<script type="module" src="js/reset-password-boot.js"></script>
<script type="module" src="js/sw-update.js"></script>
</body>
</html>
